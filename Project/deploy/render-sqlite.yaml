# Blueprint Render — versi paling cepat (tanpa database eksternal).
#
# Database memakai SQLite di dalam container. Saat container hidup,
# entrypoint otomatis membuat tabel + mengisi data contoh, jadi aplikasi
# langsung siap dipakai untuk demo.
#
# Catatan penting:
#   - Data yang diubah pengguna (akun baru, tiket) HILANG saat redeploy,
#     restart, atau service bangun dari tidur. Data contoh dibuat ulang.
#   - Untuk data permanen, ganti file ini dengan deploy/render-aiven.yaml
#     (Aiven MySQL) atau deploy/render-tidb.yaml (TiDB Cloud).
#
# Link akhir: https://<name>.onrender.com

services:
  - type: web
    name: wifi-smkn1-susukan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "true"
      - key: TRUST_PROXY
        value: "true"

      - key: DB_DRIVER
        value: sqlite
      - key: DB_SQLITE_PATH
        value: ./storage/database.sqlite

      - key: SESSION_NAME
        value: WIFI_SESSID
      - key: SESSION_LIFETIME
        value: "7200"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"

      - key: NETWORK_SOURCE
        value: simulasi
