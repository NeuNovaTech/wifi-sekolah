<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Tiket — SMK Negeri 1 Susukan</title>
  <meta name="api-base" content="/api/">
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/styles/riwayat.css?v=2" />
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script src="../assets/js/api.js"></script>
  <script src="src/scripts/user-guard.js"></script>
</head>

<body>
  <header class="header">
    <div class="bg-pattern">
      <i class="bi bi-gear"></i>
      <i class="bi bi-cpu"></i>
      <i class="bi bi-hdd-network"></i>
      <i class="bi bi-laptop"></i>
      <i class="bi bi-palette"></i>
      <i class="bi bi-hammer"></i>
      <i class="bi bi-flower1"></i>
      <i class="bi bi-heart"></i>
    </div>
    <div class="logo">
      <img src="../assets/images/logo_sekolah.png" alt="logo sekolah">
    </div>
    <h1>SMK Negeri 1 Susukan</h1>
    <p class="subtitle">Sistem Akses WiFi Terpadu</p>
    <div class="jurusan">
      <span><i class="bi bi-gear"></i> TO</span>
      <span><i class="bi bi-hdd-network"></i> TJKT</span>
      <span><i class="bi bi-palette"></i> DITF</span>
      <span><i class="bi bi-flower1"></i> KKBT</span>
    </div>
  </header>

  <main class="kotak">
    <section class="kartu">
      <h2>Riwayat Tiket Kamu</h2>

      <aside class="pengumuman">
        <h3><span class="dot"></span> Semua Laporan Tersimpan</h3>
        <ul>
          <li>Setiap keluhan yang kamu kirim muncul di sini beserta statusnya.</li>
        </ul>
      </aside>

      <div id="riwayat-alert" class="notif" hidden></div>

      <div class="filter-tiket" id="filter-tiket">
        <button type="button" class="tab-riwayat aktif" data-status="">Semua <b>0</b></button>
        <button type="button" class="tab-riwayat" data-status="menunggu">Menunggu <b>0</b></button>
        <button type="button" class="tab-riwayat" data-status="diproses">Diproses <b>0</b></button>
        <button type="button" class="tab-riwayat" data-status="selesai">Selesai <b>0</b></button>
      </div>

      <div id="daftar-riwayat" class="riwayat-list"></div>

      <p class="kembali-wrap">
        <a class="btn-kembali" href="beranda.html"><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a>
        <a class="btn-baru" href="keluhan.html"><i class="bi bi-plus-lg"></i> Buat Tiket Baru</a>
      </p>
    </section>
  </main>

  <footer class="footer">
 <p>&copy; 2026 Tim IT Sekolah Amar Lanang Yusuf & Noval</p>  </footer>

  <script src="src/scripts/riwayat.js"></script>
</body>

</html>
