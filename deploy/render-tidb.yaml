# Blueprint Render — Sistem Akses WiFi SMK Negeri 1 Susukan
# Database: TiDB Cloud Starter (MySQL-compatible).
#
# Sebelum deploy:
#   1. Buat cluster TiDB Cloud Starter.
#   2. Buat database: CREATE DATABASE wifi_db;
#   3. Catat host, username, password.
#   4. Izinkan IP 0.0.0.0/0 di Network Access TiDB.
#
# Nilai bertanda sync:false akan ditanyakan Render saat membuat Blueprint.
# Link akhir: https://<name>.onrender.com

services:
  - type: web
    name: wifi-smkn1-susukan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "true"
      - key: TRUST_PROXY
        value: "true"

      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: wifi_db
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_INSECURE
        value: "true"

      - key: SESSION_NAME
        value: WIFI_SESSID
      - key: SESSION_LIFETIME
        value: "7200"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"

      - key: NETWORK_SOURCE
        value: simulasi
