server {
    listen 80;
    listen [::]:80;
    server_name wifi-smkn1susukan.eu.org;

    root /var/www/wifi;
    index index.html;

    client_max_body_size 2m;

    # -------------------------------
    # Frontend statis
    # -------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # -------------------------------
    # API Node.js
    # -------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -------------------------------
    # Jangan sajikan file sensitif
    # -------------------------------
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    location ^~ /api/src/ { deny all; return 404; }
    location ^~ /api/database/ { deny all; return 404; }
    location ^~ /api/storage/ { deny all; return 404; }
    location ^~ /api/node_modules/ { deny all; return 404; }

    # -------------------------------
    # Cache aset statis
    # -------------------------------
    location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
