# Blueprint Render — versi MySQL (Aiven)
# Cara pakai: ganti isi render.yaml dengan file ini, commit, lalu deploy.
# Nilai bertanda sync:false akan ditanyakan Render saat membuat Blueprint.

services:
  - type: web
    name: wifi-smkn1-susukan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "true"
      - key: TRUST_PROXY
        value: "true"

      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_INSECURE
        value: "false"

      - key: SESSION_NAME
        value: WIFI_SESSID
      - key: SESSION_LIFETIME
        value: "7200"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"
